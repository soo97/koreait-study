<body>
    <button onclick="add(10,10)">10+10</button>
    <script>
        function add(num1, num2){
            alert(num1+num2);
        }
    </script>

    <!-- 
        1. 사용자 입력 받는건 prompt() 사용
        2. 버튼 클릭하면 함수 호출
    -->
    <hr>
    <button onclick="Q1()">Q1</button>
    <script>
        function Q1(){
            let birthYear = parseInt(prompt("출생연도 입력:"));
            let age = 2026 - birthYear;

            alert("당신의 나이는 :"+ age +"입니다.");
        }
    </script>
    <hr>
    <!-- 국어, 영어, 수학 점수를 입력받아 평균을 계산하여 출력 -->
    <button onclick="Q2()">Q2</button>
    <script>
        function Q2(){
            let lan = parseInt(prompt("국어 점수:"));
            let eng = parseInt(prompt("영어 점수:"));
            let math = parseInt(prompt("수학 점수:"));
            let sco = lan + eng + math;

            alert("평균 점수:"+ sco);
        }
    </script>
    <hr>
    <!-- 나이를 입력받아 19세 이상이면 "성인" 19세 미만이면 "미성년자" 출력 -->
    <button onclick="Q3()">Q3</button>
    <script>
        function Q3(){
            let year = parseInt(prompt("나이를 입력"));
            if(year>=19){
                alert("성인");
            }else{
                alert("미성년자");
            }
        }
    </script>
    <hr>
    <!-- 두개의 숫자를 입력받아 더 큰 숫자를 출력하세요. -->
    <button onclick="Q4()">Q4</button>
    <script>
        function Q4(){
            let number1 = parseInt(prompt("첫번째 숫자:"));
            let number2 = parseInt(prompt("두번째 숫자:"));

            if(number1>number2){
                alert(number1);
            }else{
                alert(number2);
            }
        }
    </script>
    <hr>
    <!-- 숫자 1개를 입력받아 짝수인지 홀수인지 출력하세요 -->
    <button onclick="Q5()">Q5</button>
    <script>
        function Q5(){
            let number3 = parseInt(prompt("숫자를 입력하세요"));
            if(number3%2==0){
                alert("짝수");
            }else{
                alert("홀수");
            }
        }
    </script>
    <hr>
    <!-- 사용자가 입력한 구구단을 출력(EX. 2입력하면 2단 출력) -->
    <button onclick="Q6()">Q6</button>
    <script>
        function Q6(){
            let number4 = parseInt(prompt("구구단 수:"));
            for(i=1; i<=9; i++){
                alert(number4 * i);
            }
        }
        </script>
    <hr>
    <!-- 숫자 1개를 입력받아 1부터 n까지의 합을 계산하고 출력 -->
    <button onclick="Q7()">Q7</button>
    <script>
        function Q7(){
            let number5 = parseInt(prompt("몇까지 더할까?"));
            let sum = 0;
            for(i=1; i<=number5; i++){
                sum += i;
            }
            alert(sum);
        }
    </script>
    <hr>
    <!--
    사용자로부터 이름을 입력받아 Alice일 경우 "다시 돌아오신걸 환영합니다!"출력
    bob일 경우 "안녕히가세요!"출력
    그 외에는 "[이름]님 어서오세요!" 출력
    -->
    <button onclick="Q8()">Q8</button>
    <script>
        function Q8(){
            let number6 = prompt("이름:");
            if(number6 == "Alice"){
                alert("다시 돌아오신걸 환영합니다!");
            }else if(number6 == "bob"){
                alert("안녕히가세요!");
            }else{
                alert("["+number6+"]님 어서오세요!")
            }
        }
    </script>
</body>
</html>
