    <!-- 국어, 영어, 수학 점수를 입력받아 평균을 계산하여 출력 -->
    <button onclick="Q2()">Q2</button>
    <script>
        function Q2(){
            let lan = parseInt(prompt("국어 점수:"));

    <!-- 나이를 입력받아 19세 이상이면 "성인" 19세 미만이면 "미성년자" 출력 -->
    <button onclick="Q3()">Q3</button>
    <script>
        function Q3(){
            let year = parseInt(prompt("나이를 입력"));
            if(year>=19){
                alert("성인");
            }else{
                alert("미성년자");
            }
        }
    </script>

    <!-- 두개의 숫자를 입력받아 더 큰 숫자를 출력하세요. -->
    <button onclick="Q4()">Q4</button>
    <script>
        function Q4(){
            let number1 = parseInt(prompt("첫번째 숫자:"));
            let number2 = parseInt(prompt("두번째 숫자:"));

            if(number1>number2){
                alert(number1);
            }else{
                alert(number2);
            }
        }
    </script>

    <!-- 숫자 1개를 입력받아 짝수인지 홀수인지 출력하세요 -->
    <button onclick="Q5()">Q5</button>
    <script>
        function Q5(){
            let number3 = parseInt(prompt("숫자를 입력하세요"));
            if(number3%2==0){
                alert("짝수");
            }else{
                alert("홀수");
            }
        }
    </script>

    <!-- 사용자가 입력한 구구단을 출력(EX. 2입력하면 2단 출력) -->
    <button onclick="Q6()">Q6</button>
    <script>
        function Q6(){
            let number4 = parseInt(prompt("구구단 수:"));
            for(i=1; i<=9; i++){
                alert(number4 * i);
            }
        }
        </script>
    <hr>
    <!-- 숫자 1개를 입력받아 1부터 n까지의 합을 계산하고 출력 -->
    <button onclick="Q7()">Q7</button>
    <script>
        function Q7(){
            let number5 = parseInt(prompt("몇까지 더할까?"));
            let sum = 0;
            for(i=1; i<=number5; i++){
                sum += i;
            }
            alert(sum);
        }
    </script>

    <button onclick="Q8()">Q8</button>

                alert("안녕히가세요!");

                alert("["+number6+"]님 어서오세요!")
            }
        }

    //2. 익명 함수
    // - 이름이 없는 함수
    // - 자주 쓰이는 곳: 이벤트, 콜백, 클로저,...
    const func2 = function(str){
        console.log(str);
    }

    //3. 화살표 함수
    // - 코드 라인을 줄이기 위해 사용
    // - this 바인딩 방식과 객체 생성, 구조등이 일반 함수와 다름
    const func3 = (num1, num2) => num1+num2;

    // -매개변수 1개 일때 : 소괄호 생략 가능
    const square = num1 => num1 *num1;

    // - 매개변수가 없을 때 : 비어있는 소괄호만 작성
    const printHellow = () => "Hello";
    console.log(printHellow);
    console.log(printHellow());
    console.log(typeof printHellow);

    // - 여러줄 작성할때 : 중괄호 사용

    const addto = (num1, num2) => {
        let result = num1 + num2;
        return result;
    }

    // 4. 생성자 함수
    // - 객체를 생성하여 재사용하기 위해 사용
    // - 관례적으로 생성자 함수는 앞 글자를 대문자로 표시
    function Person(name, age){
        this.name=name;
        this.age = age;
        this.walk = function(){
            console.log(this.name + "걷는 중");
        }
    }
    const p1 = new Person("홍길동", 20);
    const p2 = new Person("김철수", 16);

    console.log(p1);
    console.log(p2);
    console.log(p1.name);
    p1.walk();

    // 5. 내부함수와 재귀함수
    // - 내부함수: 함수 안에 또 다시 정의된 함수
    // - 재귀함수 : 자기 자신을 호출하는 함수

    // 내부 함수
    function outer(){
        let x = 10;

        function inner(){
            console.log(x);
        }
        inner();
    }
    outer();

    // 재귀 함수
    function countdown(cnt){
        if(cnt === 0){
            console.log("0이 되었습니다.");
        }else{
            console.log(cnt);
            countdown(cnt-1);
        }
    }

    // 6. 콜백 함수
    // - 매개변수에 함수가 들어오는 방식
    function first(callback){
        console.log("First");

        if(typeof callback === "function"){
            callback();
        }
    }

    // 함수를 호출할 때 인자로 함수를 전달
    first(function(){
        console.log("Second");
    })

    function processUser(name, callback){
        console.log("---요청 시작 ---");
        // console.log(name + "님 어서오세요.");
        callback(name);
        console.log("---요청 종료 ---");
    }

    //1) 개발자 A는 "ㅇㅇㅇ님 환영합니다." 출력
    processUser("홍길동", function(name){
        console.log(name + "환영합니다.");
    })

    //2) 개발자 B는 "ㅇㅇㅇ님이 로그인 하셨습니다." 출력
    // - 함수 미리 만들고 전달하기
    function developerB(name){
        console.log(name + " 님이 로그인 하셨습니다.");
    }
    processUser("홍길동", developerB);

    //3) 개발자 C는 "접속 완료!" 출력
    processUser("철수", (name) => {
        console.log("접속 완료!");
    })


    function calc(a, b, operation){
        return operation(a, b);
    }

    // 1) 더하는 기능을 가진 함수
    calc(5, 4, function(a, b){
        console.log(a+b);
    })
    // 2) 곱하는 기능을 가진 함수
    calc(5, 4, function(a, b){
        console.log(a*b);
    })

</script>
