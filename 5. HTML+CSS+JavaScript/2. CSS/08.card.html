<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root{
            --body-color:#f4f6f9;
        }
        *{
            margin:0px;
            padding:0px;
        }
        body{
            background-color:var(--body-color);
            padding: 40px;
        }

        header{
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 30px;
        }
        .container{
            display: flex;
            height: 100px;
            gap:20px;
            flex-wrap: wrap;
        }
        .card{
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
            flex-shrink: 1;
            flex-basis: calc(20% - 20px);
            background-color: white;
            box-shadow: 0 4px 10px rgb(0,0,0,0.2);
            padding:25px;
            border-radius: 10px;
        }
        .title{
            color:#555;
            font-weight: 700;
        }
        .number{
            font-size: 32px;
            font-weight: bold;
            margin:10px 0;
        }
        .discription{
            font-size: 12px;
            color:#888;
        }
    </style>
</head>
<body>
    <header>Admin DashBoard</header>
    <div class="container">
        <div class="card">
            <p class="title">Total Users</p>
            <p class="number">1,245</p>
            <p class="discription">active this month</p>
        </div>
        <div class="card">
            <p class="title">Revenue</p>
            <p class="number">1,230</p>
            <p class="discription">this month</p>
        </div>
        <div class="card">
            <p class="title">Oders</p>
            <p class="number">320</p>
            <p class="discription">Completed</p>
        </div>
        <div class="card">
            <p class="title">New Singups</p>
            <p class="number">89</p>
            <p class="discription">Today</p>
        </div>
    </div>
</body>
</html>
