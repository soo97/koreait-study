        }

        }
        .main-menu>li>a{
            padding:0 30px;
            color:#fff;
            font-weight: bold;
            line-height: 60px;
        }
        .sub-menu{
            display: none;
            position:absolute;
            background-color: #fff;
            top: 68px;
        }
        .sub-menu>li>a{
            font-size: 14px;
            border-bottom: 1px solid #eee;
            padding:10px;
        }
        .main-menu> li:hover > .sub-menu{
            display: block;
        }
        .sub-menu li a:hover{
            background-color: thistle;
        }
    </style>
