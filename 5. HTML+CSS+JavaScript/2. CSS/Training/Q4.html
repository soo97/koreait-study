<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin:0px;
        }
        .card{
            font-size: 15px;
            position: relative;
            width:200px;
            height:150px;
            padding:10px;
            margin:30px;
            background-color: #d6d6d6;
            color:#000;
        }
        .badge{
            position:absolute;
            right:10px;
            top:10px;
            color:#fff;
            background-color: red;
            padding:5px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card">
        상품 카드
        <div class="badge">NEW</div>
    </div>
</body>
</html>
