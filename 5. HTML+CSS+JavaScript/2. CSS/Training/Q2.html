<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    body{
        margin:0px;
        background-color: #f5f7fa;
        color:#222;
    }

    div{
        padding:10px;
    }
    ul{
        padding:0px;
    }
    p{
        font-size: 15px;
    }
    li{
        padding:15px;
        border: 2px solid #dbdbdb;
        list-style: none;
        margin-bottom: 10px;
    }
    .title{
        margin:0px;
        font-size: 20px;
        font-weight: bold;
    }
    .ib{
        display: inline-block;
    }
    .bo{
        display:inline-block;
        font-weight: bold;
        width: 50px;
    }
    .green{
        color:green;
    }
    .yello{
        color:yellow;
    }
    .red{
        color:red;
    }
    a{
        display:block;
        text-decoration: none;
    }

    
    </style>
</head>
<body>
    <div>
        <h1>프로그래밍 강의 목록</h1>
        <p>수강하고 싶은 강의를 선택하세요.</p>
        <ul>
            <li>
                <p class="title">HTML & CSS 입문</p>
                <p class="ib">난이도:</p><p class="bo green">초급</p>
                <a href="#">수강 신청</a>
            </li>
            <li>
                <p class="title">JAVA 백엔드 개발</p>
                <p class="ib">난이도:</p><p class="bo yello">중급</p>
                <a href="#">수강 신청</a>
            </li>
            <li>
                <p class="title">HTML & CSS 입문</p>
                <p class="ib">난이도:</p><p class="bo red">고급</p>
                <a href="#">수강 신청</a>
            </li>
        </ul>
    </div>
</body>
</html>
