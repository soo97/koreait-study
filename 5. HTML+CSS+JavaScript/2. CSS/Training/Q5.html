<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        margin:0px;
    }
    .parent{
        margin:30px;
        width:250px;
        height: 150px;
        background-color: rgb(226, 226, 226);
        position: relative;
    }
    .box1{
        position:absolute;
        width:100px;
        height:100px;
        top:0px;
        left:0px;
        background-color: rgb(54, 215, 255);
    }
    .box2{
        top:50px;
        left:50px;
        width:100px;
        height:100px;
        position:absolute;
        background-color: rgb(255, 102, 31);
        z-index: 1;
    }
</style>
<body>
    <div class="parent">
        <div class="box1"></div>
        <div class="box2"></div>
    </div>
</body>
</html>
