<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0px;
            padding:0px;
        }
        body{
            background-color: #007bff;
            height: 100vh;
        }
        .box{
            width:100px;
            height: 100px;
            position:fixed;
            bottom:0px;
            left: 50%;
            background-color: #fff;
            border-radius: 50px;
            animation: jumping 5s ease-in-out 5;
        }
        @keyframes jumping{
            0%{
                transform: translateY(0%);
            }
            50%{
                transform: translateY(-450px);
            }
            100%{
                transform: translateY(0%);
            }
        }

    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
