<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .box{
        height: 50px;

    }
    .box2{
        width: 200px;
        height: 200px;
        border:1px solid #000;
        position:relative;
    }

    .box3{
        width: 100px;
        height: 100px;
        position:absolute;
        background-color: aqua;

        top:10px;
        left:20px;
    }
    .box4{
        position:fixed;
        width: 100px;
        height: 100px;
        background-color: blueviolet;
        bottom:10px;
        right:10px;
    }

    #boxes{
        width:200px;
        height:200px;
        border:1px solid black;
        position:relative;
    }
    .absolute-box{
        width: 50px;
        height: 50px;
        border:1px solid black;
        position:absolute;
    }
    
    .box5{
        top:60px;
        left:60px;
        background-color:aqua;
        z-index: 1;
    }

    .box6{
        top:80px;
        left:80px;
        background-color: yellowgreen;
    }
    .box7{
        top:100px;
        left:100px;
        background-color: blueviolet;
        z-index: -1;
    }
</style>
<body>
    <div class="box">box</div>
    <div class="box2">
        box2
        <div class="box3">box3</div>
    </div>
    <div class="box4">box4</div>

    <div id="boxes">
        <div class="absolute-box box5">box5</div>
        <div class="absolute-box box6">box6</div>
        <div class="absolute-box box7">box7</div>
    </div>
</body>
</html>
